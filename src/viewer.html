<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Recordings</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #161922;
    --panel-2: #1d212c;
    --border: #272c38;
    --text: #e7eaf0;
    --muted: #8b93a4;
    --accent: #4c8dff;
    --danger: #ff5c5c;
    --track: #12151d;
    --block: #3a6fd0;
    --block-hi: #6ea0ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px;
    background: rgba(14,16,20,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .host { color: var(--muted); font-size: 12.5px; }
  header .count { margin-left: auto; color: var(--muted); font-size: 12.5px; }

  main { padding: 20px 22px 60px; max-width: 1200px; margin: 0 auto; }

  /* ---------- player ---------- */
  .player {
    position: sticky; top: 58px; z-index: 15;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 22px;
    display: none; grid-template-columns: minmax(0, 1.4fr) minmax(220px, 1fr); gap: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .player.open { display: grid; }
  .player video { width: 100%; max-height: 46vh; background: #000; border-radius: 8px; display: block; }
  .player .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .player .pname { font-weight: 600; word-break: break-all; }
  .player .pmeta { color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  .player .pmeta b { color: var(--text); font-weight: 600; }
  .player .actions { margin-top: auto; display: flex; gap: 9px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--panel-2); }
  .btn-danger { background: transparent; color: var(--danger); border-color: #3d2626; }
  .btn-danger:hover { background: #2a1717; }
  .btn-danger.confirm { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* ---------- timeline ---------- */
  .day { margin-bottom: 26px; }
  .day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .day-head .date { font-weight: 650; font-size: 14.5px; }
  .day-head .sub { color: var(--muted); font-size: 12px; }

  .track-wrap { position: relative; }
  .hours { position: relative; height: 16px; margin-bottom: 3px; }
  .hours span {
    position: absolute; transform: translateX(-50%);
    font-size: 10.5px; color: var(--muted); top: 0;
  }
  .track {
    position: relative; height: 46px; border-radius: 8px;
    background: var(--track); border: 1px solid var(--border); overflow: hidden;
    background-image: repeating-linear-gradient(
      to right, transparent 0, transparent calc(100%/8 - 1px),
      rgba(255,255,255,.05) calc(100%/8 - 1px), rgba(255,255,255,.05) calc(100%/8));
  }
  .block {
    position: absolute; top: 4px; bottom: 4px; min-width: 7px;
    background: var(--block); border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.15);
    display: flex; align-items: center; overflow: hidden;
    transition: background .12s, transform .12s;
  }
  .block:hover { background: var(--block-hi); z-index: 3; }
  .block.active { background: var(--block-hi); outline: 2px solid #fff; outline-offset: -1px; z-index: 4; }
  .block.unknown { background: repeating-linear-gradient(45deg,#3a6fd0,#3a6fd0 5px,#33619b 5px,#33619b 10px); }
  .block .lbl {
    font-size: 10.5px; color: #eaf1ff; padding: 0 5px; white-space: nowrap;
    pointer-events: none; text-shadow: 0 1px 1px rgba(0,0,0,.4);
  }
  .block .x {
    position: absolute; top: 1px; right: 1px; width: 15px; height: 15px;
    border: none; border-radius: 3px; background: rgba(0,0,0,.45); color: #fff;
    font-size: 11px; line-height: 1; cursor: pointer; display: none; padding: 0;
  }
  .block:hover .x { display: block; }
  .block .x:hover { background: var(--danger); }
  .block .x.confirm { display: block; background: var(--danger); width: auto; padding: 0 4px; font-size: 9px; }

  .nowline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #ff7a59; z-index: 2; }
  .nowline::after {
    content: ''; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px;
    border-radius: 50%; background: #ff7a59;
  }

  .empty { color: var(--muted); padding: 60px 20px; text-align: center; }
  .empty code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }

  @media (max-width: 760px) {
    .player { grid-template-columns: 1fr; }
    .player.open { display: block; }
    .player video { margin-bottom: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>Screen Recordings</h1>
  <span class="host" id="host"></span>
  <span class="count" id="count"></span>
</header>

<main>
  <div class="player" id="player">
    <video id="video" controls preload="metadata"></video>
    <div class="side">
      <div class="pname" id="pname"></div>
      <div class="pmeta" id="pmeta"></div>
      <div class="actions" id="pactions"></div>
    </div>
  </div>

  <div id="timeline"><div class="empty">Loading…</div></div>
</main>

<script>
  const SECONDS_PER_DAY = 86400;

  const pad = (n) => String(n).padStart(2, '0');
  const fmtSize = (b) => b >= 1e9 ? (b/1e9).toFixed(2)+' GB'
                       : b >= 1e6 ? (b/1e6).toFixed(1)+' MB'
                       : b >= 1e3 ? (b/1e3).toFixed(0)+' KB' : b+' B';
  const fmtDur = (s) => {
    if (s == null) return 'unknown length';
    s = Math.round(s);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    if (h) return `${h}h ${pad(m)}m`;
    if (m) return `${m}m ${pad(sec)}s`;
    return `${sec}s`;
  };
  const fmtClock = (ms) => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
  const fmtClockS = (ms) => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
  const dayStartOf = (ms) => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  const fmtDay = (ms) => {
    const d = new Date(ms);
    const today = dayStartOf(Date.now()), that = dayStartOf(ms);
    const diff = Math.round((today - that) / 86400000);
    const rel = diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : null;
    const full = d.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    return rel ? `${rel} · ${full}` : full;
  };

  const videoUrl = (name) => '/videos/' + encodeURIComponent(name);

  let videos = [], canDelete = false, active = null;

  function selectVideo(v) {
    active = v.name;
    const player = document.getElementById('player');
    player.classList.add('open');
    const el = document.getElementById('video');
    el.src = videoUrl(v.name);
    el.play().catch(() => {});

    document.getElementById('pname').textContent = v.name;
    document.getElementById('pmeta').innerHTML =
      `<b>Start</b> ${new Date(v.start).toLocaleString()}<br>` +
      `<b>Length</b> ${fmtDur(v.duration)} &nbsp; <b>Size</b> ${fmtSize(v.size)}`;

    const actions = document.getElementById('pactions');
    actions.innerHTML = '';
    const dl = document.createElement('a');
    dl.className = 'btn btn-primary'; dl.href = videoUrl(v.name);
    dl.setAttribute('download', v.name); dl.innerHTML = '&#x2193;&nbsp; Download';
    actions.appendChild(dl);

    if (canDelete) {
      const del = document.createElement('button');
      del.className = 'btn btn-danger'; del.innerHTML = '&#x1F5D1;&nbsp; Delete';
      makeConfirmable(del, 'Click again to delete', () => remove(v.name));
      actions.appendChild(del);
    }
    const close = document.createElement('button');
    close.className = 'btn btn-ghost'; close.textContent = 'Close';
    close.onclick = closePlayer;
    actions.appendChild(close);

    render();
  }

  function closePlayer() {
    active = null;
    const el = document.getElementById('video');
    el.pause(); el.removeAttribute('src'); el.load();
    document.getElementById('player').classList.remove('open');
    render();
  }

  /** Two-click confirm without a blocking dialog. */
  function makeConfirmable(btn, confirmText, action) {
    const original = btn.innerHTML;
    let armed = false, timer = null;
    btn.onclick = (e) => {
      e.stopPropagation();
      if (armed) { clearTimeout(timer); action(); return; }
      armed = true; btn.classList.add('confirm'); btn.innerHTML = confirmText;
      timer = setTimeout(() => { armed = false; btn.classList.remove('confirm'); btn.innerHTML = original; }, 4000);
    };
  }

  async function remove(name) {
    try {
      const res = await fetch(videoUrl(name), { method: 'DELETE' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        alert('Could not delete: ' + (body.error || res.status));
        return;
      }
      if (active === name) closePlayer();
      await refresh();
    } catch (err) {
      alert('Could not delete: ' + err.message);
    }
  }

  function makeBlock(v) {
    const start = v.start;
    const secOfDay = (start - dayStartOf(start)) / 1000;
    const durSec = v.duration || 0;
    const left = Math.max(0, Math.min(100, secOfDay / SECONDS_PER_DAY * 100));
    let width = durSec / SECONDS_PER_DAY * 100;
    if (left + width > 100) width = 100 - left;          // clamp sessions that run past midnight

    const block = document.createElement('div');
    block.className = 'block' + (v.name === active ? ' active' : '') + (v.duration == null ? ' unknown' : '');
    block.style.left = left + '%';
    block.style.width = width + '%';
    block.title = `${fmtClockS(start)} · ${fmtDur(v.duration)} · ${fmtSize(v.size)}`;
    block.onclick = () => selectVideo(v);

    const lbl = document.createElement('span');
    lbl.className = 'lbl';
    lbl.textContent = fmtClock(start);
    block.appendChild(lbl);

    if (canDelete) {
      const x = document.createElement('button');
      x.className = 'x'; x.innerHTML = '&times;'; x.title = 'Delete';
      makeConfirmable(x, 'delete?', () => remove(v.name));
      block.appendChild(x);
    }
    return block;
  }

  function render() {
    const tl = document.getElementById('timeline');
    if (!videos.length) {
      tl.innerHTML = '<div class="empty">No recordings yet.<br>A file appears here for each ' +
        'period of keyboard/mouse activity.</div>';
      return;
    }

    // group by local day
    const byDay = new Map();
    for (const v of videos) {
      const key = dayStartOf(v.start);
      if (!byDay.has(key)) byDay.set(key, []);
      byDay.get(key).push(v);
    }
    const days = [...byDay.keys()].sort((a, b) => b - a);

    tl.innerHTML = '';
    for (const day of days) {
      const items = byDay.get(day).sort((a, b) => a.start - b.start);
      const totalDur = items.reduce((s, v) => s + (v.duration || 0), 0);
      const totalSize = items.reduce((s, v) => s + v.size, 0);

      const wrap = document.createElement('div');
      wrap.className = 'day';

      const head = document.createElement('div');
      head.className = 'day-head';
      head.innerHTML = `<span class="date">${fmtDay(day)}</span>` +
        `<span class="sub">${items.length} session${items.length>1?'s':''} · ` +
        `${fmtDur(totalDur)} · ${fmtSize(totalSize)}</span>`;
      wrap.appendChild(head);

      const twrap = document.createElement('div');
      twrap.className = 'track-wrap';

      const hours = document.createElement('div');
      hours.className = 'hours';
      for (let h = 0; h <= 24; h += 3) {
        const s = document.createElement('span');
        s.style.left = (h / 24 * 100) + '%';
        s.textContent = h === 24 ? '24' : pad(h);
        hours.appendChild(s);
      }
      twrap.appendChild(hours);

      const track = document.createElement('div');
      track.className = 'track';
      for (const v of items) track.appendChild(makeBlock(v));

      // "now" marker on today's track
      if (day === dayStartOf(Date.now())) {
        const now = document.createElement('div');
        now.className = 'nowline';
        now.style.left = ((Date.now() - day) / 86400000 * 100) + '%';
        track.appendChild(now);
      }

      twrap.appendChild(track);
      wrap.appendChild(twrap);
      tl.appendChild(wrap);
    }
  }

  async function refresh() {
    try {
      const res = await fetch('/api/videos');
      const data = await res.json();
      videos = data.videos || [];
      canDelete = !!data.canDelete;
      document.getElementById('host').textContent = data.host ? 'on ' + data.host : '';
      const n = videos.length;
      document.getElementById('count').textContent = n + (n === 1 ? ' recording' : ' recordings');
      render();
    } catch {
      document.getElementById('timeline').innerHTML = '<div class="empty">Could not reach the server.</div>';
    }
  }

  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
